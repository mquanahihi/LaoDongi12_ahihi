<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lịch Lao Động - Chia Bộ Xoay Phiên</title>
<style>
:root{--bg:#f4f7f6;--card:#fff;--text:#1f2937;--muted:#64748b;--primary:#2563eb;--danger:#dc2626;--green:#16a34a;--k1:#800014;--k2:#22b14c;--k3:#3f48cc;--orange:#d97706;--group:#7c3aed}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Segoe UI,Tahoma,sans-serif;color:var(--text)}
.container{max-width:1200px;margin:25px auto;padding:24px;background:white;border-radius:16px;box-shadow:0 5px 25px #00000012}
.top{display:flex;justify-content:space-between;gap:15px;align-items:center}.top h1{margin:0;text-align:center;flex:1}.admin-btn,.primary,.secondary{border:0;border-radius:9px;padding:11px 16px;font-weight:700;cursor:pointer}.admin-btn{background:#34495e;color:white}.primary{background:var(--green);color:#fff;width:100%}.secondary{background:#2563eb;color:#fff}
.status{padding:10px 14px;border-radius:9px;margin:18px 0;font-size:14px;background:#eef2ff}.status.ok{background:#ecfdf5;color:#166534}.status.err{background:#fef2f2;color:#991b1b}
.panel{display:none;background:#f1f5f9;padding:20px;border:2px dashed #22c55e;border-radius:12px;margin-bottom:22px}.panel.show{display:block}
.form{display:grid;grid-template-columns:1fr 1fr;gap:15px}.group{display:flex;flex-direction:column;gap:7px}label{font-weight:700;font-size:14px}input,select{padding:11px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px;background:white}.full{grid-column:1/-1}
h2{text-align:center}.notice{padding:12px 15px;border:1px solid #fde68a;background:#fffbeb;border-radius:9px;margin:15px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:15px}.card{background:white;border-radius:12px;box-shadow:0 2px 10px #00000010;padding:15px;border-top:6px solid #ccc}.card.k1{border-color:var(--k1)}.card.k2{border-color:var(--k2)}.card.card.k3{border-color:var(--k3)}.card.exempt{border-color:var(--orange)}.card.absent{border-color:var(--danger)}.head{display:flex;justify-content:space-between;border-bottom:1px solid #e5e7eb;padding-bottom:9px;margin-bottom:10px;font-weight:700}
.member{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;background:#f8fafc;border-radius:7px;margin:5px 0;font-size:14px}
.member-info{display:flex;align-items:center;gap:8px}
.member-info input[type="checkbox"]{cursor:pointer;width:16px;height:16px}
.member.strike .name-text{text-decoration:line-through;color:#94a3b8}
.room{color:#64748b;font-size:12px}.history{margin-top:35px;border-top:2px solid #e5e7eb;padding-top:20px}.history-form{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;align-items:end}.small{font-size:12px;color:var(--muted)}.map-box{text-align:center;margin:20px 0;background:#fff;padding:15px;border-radius:12px;border:1px solid #e2e8f0}
.badge-group{display:inline-block;padding:4px 12px;border-radius:20px;background:#7c3aed;color:#fff;font-size:14px;font-weight:bold;margin-bottom:10px}
@media(max-width:700px){.container{margin:8px;padding:15px}.form{grid-template-columns:1fr}.top{align-items:flex-start}.top h1{font-size:20px}.admin-btn{font-size:12px;padding:8px}}
</style>
</head>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const ADMIN_PASSWORD = "minhquani12";
let isAdmin = false;
let currentScheduleData = null;

const rooms = {
 p1333:{name:"Phòng 13-33",members:["Bùi Đức Thịnh","Trương Anh Kiệt","Đậu Lê Minh Hoàng","Nguyễn Tấn Dũng"]},
 p15:{name:"Phòng 15",members:["Trương Bách Thành","Lê Tuấn Công","Lê Phạm Hoàng Anh","Nguyễn Tấn Hùng","Hoàng Hữu Túc","Nguyễn Phúc Tiến Hưng"]},
 p27:{name:"Phòng 27",members:["Nguyễn Xuân Hoà","Nguyễn Thiện Bảo","Trịnh Gia Huy","Nguyễn Minh Phúc","Trần Đình Trí"]},
 p30:{name:"Phòng 30",members:["Phan Đình Triệu","Nguyễn Trung Anh","Vũ Đình Phú","Ngô Nguyễn Anh Quân","Đỗ Vũ Gia Hiếu"]},
 p34:{name:"Phòng 34",members:["Nguyễn Thế Trung","Phạm Hữu Nhân","Trần Văn Huy","Bùi Minh Quân","Bùi Hiếu Nghĩa","Nguyễn Tiến Đạt"]},
 p52:{name:"Phòng 52",members:["Thái Thị Diệu Hiền","Tạ Thị Diễm My","Nguyễn Hà My","Nguyễn Thị Tường Lam","Trần Ngọc Trâm","Hồ Thị Khánh Băng"]}
};

const groupA_Girls = [
  {name:"Thái Thị Diệu Hiền", room:"Phòng 52"},
  {name:"Tạ Thị Diễm My", room:"Phòng 52"},
  {name:"Nguyễn Hà My", room:"Phòng 52"}
];
const groupA_Boys = [
  {name:"Nguyễn Trung Anh", room:"Phòng 30"},
  {name:"Lê Phạm Hoàng Anh", room:"Phòng 15"},
  {name:"Nguyễn Thiện Bảo", room:"Phòng 27"},
  {name:"Lê Tuấn Công", room:"Phòng 15"},
  {name:"Nguyễn Tấn Dũng", room:"Phòng 13-33"},
  {name:"Nguyễn Tiến Đạt", room:"Phòng 34"},
  {name:"Đỗ Vũ Gia Hiếu", room:"Phòng 30"},
  {name:"Nguyễn Xuân Hoà", room:"Phòng 27"},
  {name:"Đậu Lê Minh Hoàng", room:"Phòng 13-33"},
  {name:"Nguyễn Tấn Hùng", room:"Phòng 15"},
  {name:"Nguyễn Phúc Tiến Hưng", room:"Phòng 15"},
  {name:"Trịnh Gia Huy", room:"Phòng 27"},
  {name:"Trần Văn Huy", room:"Phòng 34"}
];

const groupB_Girls = [
  {name:"Nguyễn Thị Tường Lam", room:"Phòng 52"},
  {name:"Trần Ngọc Trâm", room:"Phòng 52"},
  {name:"Hồ Thị Khánh Băng", room:"Phòng 52"}
];
const groupB_Boys = [
  {name:"Trương Anh Kiệt", room:"Phòng 13-33"},
  {name:"Bùi Hiếu Nghĩa", room:"Phòng 34"},
  {name:"Phạm Hữu Nhân", room:"Phòng 34"},
  {name:"Nguyễn Minh Phúc", room:"Phòng 27"},
  {name:"Vũ Đình Phú", room:"Phòng 30"},
  {name:"Ngô Nguyễn Anh Quân", room:"Phòng 30"},
  {name:"Bùi Minh Quân", room:"Phòng 34"},
  {name:"Bùi Đức Thịnh", room:"Phòng 13-33"},
  {name:"Trương Bách Thành", room:"Phòng 15"},
  {name:"Phan Đình Triệu", room:"Phòng 30"},
  {name:"Trần Đình Trí", room:"Phòng 27"},
  {name:"Nguyễn Thế Trung", room:"Phòng 34"},
  {name:"Hoàng Hữu Túc", room:"Phòng 15"}
];

const $ = id => document.getElementById(id);

function today(){
 const d=new Date(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0");
 return `${d.getFullYear()}-${m}-${day}`;
}

function dayIndex(s){
 const p=s.split("-"),d=new Date(+p[0],+p[1]-1,+p[2]),y=new Date(+p[0],0,1);
 return Math.floor((d-y)/86400000);
}

function monday(s){
 return new Date(...s.split("-").map((v,i)=>i===1?+v-1:+v)).getDay()===1;
}

function localCalculate(date, roomKey){
 const idx = dayIndex(date);
 const isGroupA = (idx % 2 === 0);
 
 let currentGirls = isGroupA ? [...groupA_Girls] : [...groupB_Girls];
 let currentBoys = isGroupA ? [...groupA_Boys] : [...groupB_Boys];
 const groupName = isGroupA ? "BỘ A (16 học sinh)" : "BỘ B (15 học sinh)";

 let exempt = [];
 let absent = [];
 let notice = `📢 <b>Hôm nay đến lượt: ${groupName} thực hiện lao động.</b><br>`;

 if(monday(date)){
   if(roomKey !== "none" && rooms[roomKey]){
     const isExempt = s => rooms[roomKey].members.includes(s.name);
     
     const exemptGirls = currentGirls.filter(isExempt);
     const exemptBoys = currentBoys.filter(isExempt);
     exempt = [...exemptGirls, ...exemptBoys];

     currentGirls = currentGirls.filter(s => !isExempt(s));
     currentBoys = currentBoys.filter(s => !isExempt(s));

     notice += `📌 <b>Thứ 2:</b> <b>${rooms[roomKey].name}</b> đi xếp ghế chào cờ (Miễn lao động). Số học sinh còn lại (${currentGirls.length + currentBoys.length} bạn) chia đều vào 3 khu.`;
   } else {
     notice += `📌 <b>Thứ 2:</b> Chưa chọn phòng xếp ghế. (${currentGirls.length + currentBoys.length} bạn chia vào 3 khu).`;
   }
 } else {
   notice += `Số học sinh thực hiện lao động hôm nay: <b>${currentGirls.length + currentBoys.length} bạn</b> được chia vào 3 phân khu.`;
 }

 const girlGroups = [[], [], []];
 currentGirls.forEach((girl, i) => {
   girlGroups[i % 3].push(girl);
 });

 const boyGroups = [[], [], []];
 const base = Math.floor(currentBoys.length / 3);
 const rem = currentBoys.length % 3;
 boyGroups[0] = currentBoys.slice(0, base + (rem > 0));
 boyGroups[1] = currentBoys.slice(base + (rem > 0), base + (rem > 0) + base + (rem > 1));
 boyGroups[2] = currentBoys.slice(base + (rem > 0) + base + (rem > 1));

 const combinedGroups = [
   [...girlGroups[0], ...boyGroups[0]],
   [...girlGroups[1], ...boyGroups[1]],
   [...girlGroups[2], ...boyGroups[2]]
 ];

 const sh = idx % 3;

 return {
   groupName,
   k1: combinedGroups[sh % 3],
   k2: combinedGroups[(sh + 1) % 3],
   k3: combinedGroups[(sh + 2) % 3],
   exempt,
   absent,
   notice,
   notWorking: {}
 };
}

function card(title, list, cls, isInteractive = false){
 return `<div class="card ${cls}">
   <div class="head"><span>${title}</span><span>${list.length} bạn</span></div>
   ${list.map(s => {
     const notWorkingMap = currentScheduleData?.notWorking || {};
     const isChecked = !!notWorkingMap[s.name];
     const disabledAttr = (isAdmin && isInteractive) ? '' : 'disabled';
     return `
       <div class="member ${isChecked ? 'strike' : ''}">
         <div class="member-info">
           <input type="checkbox" data-name="${s.name}" ${isChecked ? 'checked' : ''} ${disabledAttr}>
           <b class="name-text">${s.name}</b>
         </div>
         <span class="room">${s.room}</span>
       </div>`;
   }).join("")}
 </div>`;
}

function render(data, isInteractive = true, targetId = "scheduleDisplay"){
 currentScheduleData = data;
 $(targetId).innerHTML = card("KHU 1 (Cụm đỏ)", data.k1, "k1", isInteractive) +
   card("KHU 2 (Cụm xanh lá)", data.k2, "k2", isInteractive) +
   card("KHU 3 (Cụm xanh dương)", data.k3, "k3", isInteractive) +
   (data.exempt.length ? card("Xếp Ghế Chào Cờ (Miễn LĐ)", data.exempt, "exempt", isInteractive) : "") +
   (data.absent.length ? card("Nghỉ Việc Riêng", data.absent, "absent", isInteractive) : "");
 
 if(targetId === "scheduleDisplay") {
   $("groupBadge").textContent = data.groupName || "";
   $("noticeBox").style.display = data.notice ? "block" : "none";
   $("noticeBox").innerHTML = data.notice || "";
 }
}

function attachCheckboxListeners(){
 document.querySelectorAll('#scheduleDisplay input[type="checkbox"]').forEach(chk => {
   chk.onchange = async (e) => {
     if(!isAdmin){
       e.target.checked = !e.target.checked;
       return alert("Chỉ Admin mới có quyền tích chọn!");
     }
     const name = e.target.getAttribute('data-name');
     if(!currentScheduleData.notWorking) currentScheduleData.notWorking = {};
     currentScheduleData.notWorking[name] = e.target.checked;
     
     const date = $("workDate").value;
     try {
       await set(ref(db, "schedules/" + date), currentScheduleData);
       render(currentScheduleData, true);
       attachCheckboxListeners();
     } catch(err) {
       alert("Lỗi cập nhật trạng thái: " + err.message);
     }
   };
 });
}

function title(date){
 const p=date.split("-"),d=new Date(+p[0],+p[1]-1,+p[2]);
 $("scheduleTitle").textContent="Lịch Lao Động - "+d.toLocaleDateString("vi-VN",{weekday:"long",year:"numeric",month:"numeric",day:"numeric"});
}

function showLocal(date,room){
 title(date);
 const d = localCalculate(date,room);
 render(d);
 attachCheckboxListeners();
}

async function loadSchedule(date, fallbackRoom="none", target="main"){
 try{
   const snap=await get(ref(db,"schedules/"+date));
   let data=snap.exists()?snap.val():null;
   if(data){
     data.k1=data.k1||[];data.k2=data.k2||[];data.k3=data.k3||[];data.exempt=data.exempt||[];data.absent=data.absent||[];data.notWorking=data.notWorking||{};
     if(target==="main") showData(data,date); 
     else render(data, false, "historyDisplay");
   }else{
     const d=localCalculate(date,fallbackRoom);
     if(target==="main") showData(d,date); 
     else render(d, false, "historyDisplay");
   }
 }catch(e){setStatus("Không đọc được Firebase: "+e.message,true); if(target==="main")showLocal(date,fallbackRoom);}
}

function showData(data,date){
 title(date);
 render(data, true);
 attachCheckboxListeners();
}

function setStatus(text,error=false){$("status").textContent=text;$("status").className="status "+(error?"err":"ok")}

$("adminBtn").onclick=()=>{
 if(!isAdmin){
   const p=prompt("Nhập mật khẩu Admin:");
   if(p===ADMIN_PASSWORD){
     isAdmin=true;
     $("adminPanel").classList.add("show");
     $("adminBtn").textContent="🔒 Đăng xuất Admin";
     if(currentScheduleData) {
       render(currentScheduleData, true);
       attachCheckboxListeners();
     }
   }else if(p!==null)alert("Mật khẩu không đúng!");
 }else{
   isAdmin=false;
   $("adminPanel").classList.remove("show");
   $("adminBtn").textContent="🔑 Admin";
   if(currentScheduleData) {
     render(currentScheduleData, true);
     attachCheckboxListeners();
   }
 }
};

$("saveBtn").onclick=async()=>{
 if(!isAdmin)return;
 const date=$("workDate").value,room=$("chairRoom").value;
 if(!date)return alert("Vui lòng chọn ngày!");
 const btn=$("saveBtn");btn.disabled=true;btn.textContent="⏳ Đang lưu...";
 try{
   const data=localCalculate(date,room);
   data.savedAt=new Date().toISOString();data.chairRoom=room;
   if(currentScheduleData && currentScheduleData.notWorking) {
     data.notWorking = currentScheduleData.notWorking;
   }
   await set(ref(db,"schedules/"+date),data);
   history.pushState({}, "", "?date="+encodeURIComponent(date));
   showData(data,date);setStatus("✅ Đã lưu lịch lên hệ thống. Mọi thiết bị sẽ đọc cùng dữ liệu này.");
   alert("Đã cập nhật lịch toàn hệ thống!");
 }catch(e){alert("Lỗi khi lưu: "+e.message);setStatus("Lưu thất bại: "+e.message,true)}
 btn.disabled=false;btn.textContent="💾 Lưu & Cập Nhật Lịch Toàn Hệ Thống";
};

function updateHistoryMonday(){
 const d=$("historyDate").value,isM=d&&monday(d);
 $("historyChairWrap").style.display=isM?"flex":"none";
}
$("historyDate").onchange=updateHistoryMonday;
$("historyBtn").onclick=async()=>{
 const d=$("historyDate").value;if(!d)return alert("Vui lòng chọn ngày!");
 $("historyStatus").textContent="Đang tải...";
 await loadSchedule(d,$("historyChairRoom").value,"history");
 $("historyStatus").textContent="";
};

$("historyDate").value=today();$("workDate").value=new URLSearchParams(location.search).get("date")||today();
