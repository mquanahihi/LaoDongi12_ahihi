<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lịch Lao Động 11I</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f6;font-family:Arial,sans-serif;color:#1f2937}.wrap{max-width:1150px;margin:25px auto;background:#fff;padding:22px;border-radius:15px;box-shadow:0 5px 25px #0001}h1{text-align:center}.top{display:flex;justify-content:space-between;align-items:center}.btn{border:0;border-radius:8px;padding:11px 15px;font-weight:bold;cursor:pointer}.admin{background:#34495e;color:white}.save{background:#16a34a;color:white;width:100%}.blue{background:#2563eb;color:white}.status{padding:11px;margin:15px 0;border-radius:8px;background:#eef2ff}.panel{display:none;background:#f1f5f9;padding:18px;border:2px dashed #22c55e;border-radius:10px}.panel.show{display:block}.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}.group{display:flex;flex-direction:column;gap:6px}input,select{padding:10px;border:1px solid #cbd5e1;border-radius:7px}.full{grid-column:1/-1}.team{text-align:center;font-weight:bold;padding:11px;background:#eff6ff;border-radius:8px;margin:15px 0}.notice{padding:12px;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{padding:14px;border-radius:10px;background:#fff;box-shadow:0 2px 9px #0001;border-top:6px solid #aaa}.k1{border-color:#8b0000}.k2{border-color:#2e8b57}.k3{border-color:#3152a5}.exempt{border-color:#d97706}.absent{border-color:#dc2626}.head{display:flex;justify-content:space-between;font-weight:bold;border-bottom:1px solid #ddd;padding-bottom:8px}.person{padding:7px;margin:5px 0;background:#f8fafc;border-radius:6px;font-size:14px}.history{border-top:2px solid #eee;margin-top:30px;padding-top:20px}.historybar{display:flex;gap:10px;justify-content:center;align-items:end;flex-wrap:wrap}.small{font-size:12px;color:#64748b}@media(max-width:750px){.form,.grid{grid-template-columns:1fr}.wrap{margin:8px;padding:14px}.top h1{font-size:20px}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div></div><h1>📋 Lịch Lao Động Lớp 11I</h1><button id="adminBtn" class="btn admin">🔑 Đăng nhập Admin</button></div>
<div id="status" class="status">Đang kết nối Firebase...</div>

<div id="panel" class="panel">
<h2>⚙️ Bảng điều khiển Admin</h2>
<div class="notice">👑 Admin: <b>buiminhquan2009ti@gmail.com</b><br>33 học sinh được chia thành <b>Đội A (17)</b> và <b>Đội B (16)</b>. Hai đội luân phiên từng ngày.</div>
<div class="form">
<div class="group"><label>Ngày</label><input type="date" id="workDate"></div>
<div class="group"><label>Phòng xếp ghế (Thứ 2)</label><select id="chairRoom"><option value="none">-- Không chọn --</option><option value="p1333">Phòng 13-33</option><option value="p15">Phòng 15</option><option value="p27">Phòng 27</option><option value="p30">Phòng 30</option><option value="p34">Phòng 34</option><option value="p52">Phòng 52</option></select></div>
<div class="full"><button id="saveBtn" class="btn save">💾 Lưu & Cập Nhật Lịch Toàn Hệ Thống</button></div>
</div></div>

<h2 id="title">Lịch Lao Động</h2><div id="team" class="team"></div><div id="notice" class="notice" style="display:none"></div><div id="display" class="grid"></div>

<div class="history"><h2>🔍 Tra Cứu Lịch</h2><div class="historybar"><div class="group"><label>Ngày</label><input type="date" id="historyDate"></div><button id="historyBtn" class="btn blue">Xem Lịch</button></div><div id="historyDisplay" class="grid" style="margin-top:15px"></div></div>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import{getDatabase,ref,get,set,onValue}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

const firebaseConfig={
apiKey:"AIzaSyDsIVvtf6rIceBshi0jTIaZ9QwpMHn2_yI",
authDomain:"laodongi12ahihihi.firebaseapp.com",
databaseURL:"https://laodongi12ahihihi-default-rtdb.firebaseio.com",
projectId:"laodongi12ahihihi",
storageBucket:"laodongi12ahihihi.firebasestorage.app",
messagingSenderId:"849833785450",
appId:"1:849833785450:web:79ff4bc0f7ee219c633213",
measurementId:"G-PHE85VE3MM"};

const app=initializeApp(firebaseConfig),db=getDatabase(app),auth=getAuth(app),provider=new GoogleAuthProvider();
const ADMIN="buiminhquan2009ti@gmail.com";

const students=[
["Nguyễn Trung Anh","Phòng 30"],["Lê Phạm Hoàng Anh","Phòng 15"],["Hồ Thị Khánh Băng","Phòng 52"],["Nguyễn Thiện Bảo","Phòng 27"],["Lê Tuấn Công","Phòng 15"],["Nguyễn Tấn Dũng","Phòng 13-33"],["Nguyễn Tiến Đạt","Phòng 34"],["Đỗ Vũ Gia Hiếu","Phòng 30"],["Thái Thị Diệu Hiền","Phòng 52"],["Nguyễn Xuân Hoà","Phòng 27"],["Đậu Lê Minh Hoàng","Phòng 13-33"],["Nguyễn Tấn Hùng","Phòng 15"],["Nguyễn Phúc Tiến Hưng","Phòng 15"],["Trịnh Gia Huy","Phòng 27"],["Trần Văn Huy","Phòng 34"],["Trương Anh Kiệt","Phòng 13-33"],["Nguyễn Thị Tường Lam","Phòng 52"],["Tạ Thị Diễm My","Phòng 52"],["Nguyễn Hà My","Phòng 52"],["Bùi Hiếu Nghĩa","Phòng 34"],["Phạm Hữu Nhân","Phòng 34"],["Nguyễn Minh Phúc","Phòng 27"],["Vũ Đình Phú","Phòng 30"],["Ngô Nguyễn Anh Quân","Phòng 30"],["Bùi Minh Quân","Phòng 34"],["Bùi Đức Thịnh","Phòng 13-33"],["Trương Bách Thành","Phòng 15"],["Trần Ngọc Trâm","Phòng 52"],["Phan Đình Triệu","Phòng 30"],["Trần Đình Trí","Phòng 27"],["Nguyễn Thế Trung","Phòng 34"],["Hoàng Hữu Túc","Phòng 15"],["Nguyễn Tấn Hùng 2","Phòng 15"]
].map(x=>({name:x[0],room:x[1]}));

const rooms={
p1333:["Bùi Đức Thịnh","Trương Anh Kiệt","Đậu Lê Minh Hoàng","Nguyễn Tấn Dũng"],p15:["Trương Bách Thành","Lê Tuấn Công","Lê Phạm Hoàng Anh","Nguyễn Tấn Hùng","Hoàng Hữu Túc","Nguyễn Phúc Tiến Hưng"],p27:["Nguyễn Xuân Hoà","Nguyễn Thiện Bảo","Trịnh Gia Huy","Nguyễn Minh Phúc","Trần Đình Trí"],p30:["Phan Đình Triệu","Nguyễn Trung Anh","Vũ Đình Phú","Ngô Nguyễn Anh Quân","Đỗ Vũ Gia Hiếu"],p34:["Nguyễn Thế Trung","Phạm Hữu Nhân","Trần Văn Huy","Bùi Minh Quân","Bùi Hiếu Nghĩa","Nguyễn Tiến Đạt"],p52:["Thái Thị Diệu Hiền","Tạ Thị Diễm My","Nguyễn Hà My","Nguyễn Thị Tường Lam","Trần Ngọc Trâm","Hồ Thị Khánh Băng"]};

const A=students.slice(0,17),B=students.slice(17);

function index(d){let p=d.split("-").map(Number),x=new Date(p[0],p[1]-1,p[2]),y=new Date(p[0],0,1);return Math.floor((x-y)/86400000)}
function monday(d){let p=d.split("-").map(Number);return new Date(p[0],p[1]-1,p[2]).getDay()===1}
function split3(a){let n=a.length,b=Math.floor(n/3),r=n%3,s=b+(r>0),t=b+(r>1);return[a.slice(0,s),a.slice(s,s+t),a.slice(s+t)]}

/* Mỗi ngày chỉ một đội làm.
   Đội A: 17 người, Đội B: 16 người.
   Ba nhóm trong đội xoay Khu 1/2/3.
   Vì đội luân phiên A-B-A-B nên không ai làm 2 ngày liên tiếp. */
function calc(date,room="none"){
 let i=index(date),isA=i%2===0,list=(isA?A:B).map(x=>({...x})),ex=[],abs=[],note="";
 if(monday(date)){
  let t=list.find(x=>x.name==="Bùi Đức Thịnh");
  if(t){abs=[t];list=list.filter(x=>x.name!=="Bùi Đức Thịnh")}
  if(room!=="none"&&rooms[room]){
   ex=list.filter(x=>rooms[room].includes(x.name));list=list.filter(x=>!rooms[room].includes(x.name));
   note="📌 Thứ 2: nhóm xếp ghế chào cờ được miễn lao động.";
  }
 }
 let g=split3(list),shift=isA?(Math.floor(i/2)%3):((Math.floor((i-1)/2)%3+3)%3);
 return{team:isA?"Đội A":"Đội B",teamSize:isA?A.length:B.length,k1:g[shift%3],k2:g[(shift+1)%3],k3:g[(shift+2)%3],exempt:ex,absent:abs,notice:note,chairRoom:room}
}
function card(t,a,c){return`<div class="card ${c}"><div class="head"><span>${t}</span><span>${a.length} bạn</span></div>${a.map(x=>`<div class="person"><b>${x.name}</b><br><span class="small">${x.room}</span></div>`).join("")}</div>`}
function render(d,date,target="display"){
 if(target==="display"){
  let p=date.split("-"),x=new Date(p[0],p[1]-1,p[2]);
  title.textContent="Lịch Lao Động - "+x.toLocaleDateString("vi-VN",{weekday:"long",year:"numeric",month:"numeric",day:"numeric"});
  team.innerHTML=`👥 Hôm nay: <b>${d.team}</b> — ${d.teamSize} học sinh`;
  notice.style.display=d.notice?"block":"none";notice.innerHTML=d.notice||"";
 }
 document.getElementById(target).innerHTML=card("KHU 1 (Dọc & Sân trên)",d.k1||[],"k1")+card("KHU 2 (Sân ngang)",d.k2||[],"k2")+card("KHU 3 (Cụm bên phải)",d.k3||[],"k3")+(d.exempt?.length?card("Xếp Ghế Chào Cờ",d.exempt,"exempt"):"")+(d.absent?.length?card("Nghỉ Việc Riêng",d.absent,"absent"):"");
}
function status(t,e=false){document.getElementById("status").textContent=t;document.getElementById("status").className="status "+(e?"err":"")}

let isAdmin=false;
adminBtn.onclick=async()=>{try{if(isAdmin)await signOut(auth);else await signInWithPopup(auth,provider)}catch(e){alert("Lỗi đăng nhập: "+e.message)}};
onAuthStateChanged(auth,u=>{isAdmin=!!u&&(u.email||"").toLowerCase()===ADMIN;panel.classList.toggle("show",isAdmin);adminBtn.textContent=isAdmin?"🔒 Đăng xuất Admin":"🔑 Đăng nhập Admin";status(isAdmin?"👑 Admin đã đăng nhập: "+u.email:"🟢 Chế độ xem — chỉ Admin được lưu lịch.")});

saveBtn.onclick=async()=>{
 if(!isAdmin)return alert("Bạn phải đăng nhập đúng tài khoản Admin.");
 let d=workDate.value,r=chairRoom.value;if(!d)return alert("Chọn ngày trước.");
 try{let data=calc(d,r);data.savedAt=new Date().toISOString();await set(ref(db,"schedules/"+d),data);render(data,d);status("✅ Đã lưu lịch lên Firebase. Mọi thiết bị dùng cùng lịch.");alert("Đã lưu!")}catch(e){status("❌ "+e.message,true);alert("Không thể lưu: "+e.message)}
};
historyBtn.onclick=async()=>{let d=historyDate.value;if(!d)return alert("Chọn ngày.");historyDisplay.innerHTML="<p>⏳ Đang tải...</p>";try{let s=await get(ref(db,"schedules/"+d));render(s.exists()?s.val():calc(d),"", "historyDisplay")}catch(e){historyDisplay.innerHTML="<p>Lỗi: "+e.message+"</p>"}};

let initial=new URLSearchParams(location.search).get("date")||new Date().toISOString().slice(0,10);
workDate.value=initial;historyDate.value=initial;
get(ref(db,"schedules/"+initial)).then(s=>render(s.exists()?s.val():calc(initial),initial));
onValue(ref(db,"schedules/"+initial),s=>{if(s.exists()){render(s.val(),initial);status("🟢 Lịch Firebase đang được đồng bộ.")}});
</script>
</body>
</html>
